[project]
name = "core-backend"
version = "0.1.0"
description = "CORE System Backend FastAPI app to orchestrate the cognitive architecture and agentic capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "fastapi>=0.115.12",
    "fastmcp>=2.5.1",
    "langchain>=0.3.25",
    "langchain-anthropic>=0.3.15",
    "langchain-openai>=0.3.18",
    "langchain-community>=0.3.0",
    "langchain-postgres>=0.0.12",
    "langgraph>=0.4.7",
    "langmem>=0.0.29",
    "openai>=1.82.0",
    "psutil>=7.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "langchain-mcp-adapters>=0.1.11",
    "docker>=7.0.0",
    "aiosqlite>=0.22.1",
    "discord.py>=2.3.0",
    "pymupdf>=1.25.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"
testpaths = ["tests", "app"]
# Exclude standalone scripts that aren't real test modules
collect_ignore = ["test_sync.py"]
filterwarnings = [
    "ignore:.*datetime\\.datetime\\.utcnow.*:DeprecationWarning",
    "ignore:.*class-based `config` is deprecated.*:DeprecationWarning",
    "ignore:.*Importing Send from langgraph.constants.*:DeprecationWarning",
    "ignore:.*The `dict` method is deprecated.*:DeprecationWarning",
    "ignore:.*json_encoders.*is deprecated.*:DeprecationWarning",
]
