<nav class="side-nav">
  <!-- Main Navigation -->
  <div class="nav-content">
    <!-- Primary Navigation -->
    <div class="nav-section">
      <div class="nav-items">
        <button mat-icon-button class="nav-item" [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" matTooltip="Dashboard" matTooltipPosition="right">
          <mat-icon>dashboard</mat-icon>
        </button>
        
        <button mat-icon-button class="nav-item" [routerLink]="['/boards']" routerLinkActive="active" matTooltip="Boards" matTooltipPosition="right">
          <mat-icon>view_quilt</mat-icon>
        </button>

        <button mat-icon-button class="nav-item" [routerLink]="['/communication']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" matTooltip="Communication Commons" matTooltipPosition="right">
          <mat-icon>forum</mat-icon>
        </button>

        <button mat-icon-button class="nav-item" [routerLink]="['/planet-lab']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" matTooltip="Procedural World Lab" matTooltipPosition="right">
          <mat-icon>public</mat-icon>
        </button>

        <button mat-icon-button class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" [matMenuTriggerFor]="agentsMenu" #agentsMenuTrigger="matMenuTrigger" matTooltip="Agents" matTooltipPosition="right" (click)="openMenu('agents')">
          <mat-icon>smart_toy</mat-icon>
        </button>
        <mat-menu #agentsMenu="matMenu" class="side-menu" xPosition="after" yPosition="below">
          <button mat-menu-item [routerLink]="['/agents']"><mat-icon>add_circle</mat-icon><span>Agent Builder</span></button>
          <button mat-menu-item [routerLink]="['/agents/library']"><mat-icon>library_books</mat-icon><span>My Agent Library</span></button>
          <button mat-menu-item [routerLink]="['/agents/marketplace']"><mat-icon>store</mat-icon><span>Agent Marketplace</span></button>
          <button mat-menu-item [routerLink]="['/agents/sentries']"><mat-icon>visibility</mat-icon><span>Sentries</span></button>
        </mat-menu>

        <button mat-icon-button class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" [matMenuTriggerFor]="workflowsMenu" #workflowsMenuTrigger="matMenuTrigger" matTooltip="Workflows" matTooltipPosition="right" (click)="openMenu('workflows')">
          <mat-icon>account_tree</mat-icon>
        </button>
        <mat-menu #workflowsMenu="matMenu" class="side-menu" xPosition="after" yPosition="below">
          <button mat-menu-item [routerLink]="['/workflows/new']"><mat-icon>add_box</mat-icon><span>New Workflow</span></button>
          <button mat-menu-item [routerLink]="['/workflows']"><mat-icon>timeline</mat-icon><span>Active Workflows</span></button>
          <button mat-menu-item [routerLink]="['/workflows/history']"><mat-icon>history</mat-icon><span>History</span></button>
        </mat-menu>

        <button mat-icon-button class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" [matMenuTriggerFor]="knowledgeMenu" #knowledgeMenuTrigger="matMenuTrigger" matTooltip="Knowledge" matTooltipPosition="right" (click)="openMenu('knowledge')">
          <mat-icon>psychology</mat-icon>
        </button>
        <mat-menu #knowledgeMenu="matMenu" class="side-menu" xPosition="after" yPosition="below">
          <button mat-menu-item [routerLink]="['/knowledge']"><mat-icon>folder</mat-icon><span>Knowledge Base</span></button>
          <button mat-menu-item [routerLink]="['/knowledge-attribution']"><mat-icon>link</mat-icon><span>Attribution Browser</span></button>
        </mat-menu>

        @if (discordBridgeIndicator$ | async; as discordBridgeIndicator) {
        <button mat-icon-button class="nav-item" [routerLink]="['/tools']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" [matTooltip]="getToolsTooltip(discordBridgeIndicator)" matTooltipPosition="right">
          <mat-icon>extension</mat-icon>
          <app-discord-bridge-status-badge
            class="nav-status-badge"
            [indicator]="discordBridgeIndicator"
            variant="dot"
            labelPrefix="Discord Gateway status"></app-discord-bridge-status-badge>
        </button>
        }

        <button mat-icon-button class="nav-item" [routerLink]="['/analytics']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" matTooltip="Analytics" matTooltipPosition="right">
          <mat-icon>analytics</mat-icon>
        </button>

        <button mat-icon-button class="nav-item" [routerLink]="['/conversations']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" matTooltip="Conversations" matTooltipPosition="right">
          <mat-icon>chat</mat-icon>
        </button>
      </div>
    </div>
  </div>
</nav>
