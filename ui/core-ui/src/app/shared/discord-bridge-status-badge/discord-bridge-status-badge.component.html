@if (variant === 'dot') {
  <span
    class="status-dot"
    [class]="toneClass"
    [attr.aria-label]="ariaLabel"
    [attr.title]="indicator?.tooltip ?? ariaLabel"
    role="status"></span>
} @else {
  <span
    class="status-chip"
    [class]="toneClass"
    [attr.aria-label]="ariaLabel"
    [attr.title]="indicator?.tooltip ?? ariaLabel"
    role="status">
    <span class="status-chip-dot"></span>
    <span class="status-chip-label">{{ indicator?.label ?? 'Unknown' }}</span>
  </span>
}
