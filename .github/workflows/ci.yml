name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Only the latest run per ref needs to finish; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      # pgvector image matches the app's actual database (plain postgres lacks
      # the `vector` extension), keeping CI aligned with production.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core_dev
          POSTGRES_DB: core_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (black)
        run: uv run black --check app/ tests/

      # `app` is importable via pytest `pythonpath = ["."]` in pyproject.toml,
      # so no PYTHONPATH wiring is needed here. test_sync.py is excluded by
      # testpaths (tests/, app/), so no --ignore is required either.
      - name: Run tests
        env:
          DATABASE_URL: postgresql://core:core_dev@localhost:5432/core_db
          REDIS_URL: redis://localhost:6379
          CORE_API_KEY: ci-test-key
          OPENAI_API_KEY: sk-fake-for-ci
          ANTHROPIC_API_KEY: sk-ant-fake-for-ci
        run: uv run pytest --tb=short -q

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui/core-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/core-ui/package-lock.json

      # --legacy-peer-deps: @angular/material@19.2.17 pins @angular/cdk@19.2.17
      # while the lockfile resolves cdk@19.2.19 (a benign patch-level mismatch).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ng lint exits non-zero only on errors; the remaining ~190 any/console
      # items are configured as warnings and do not block.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:ng -- --configuration development

      - name: Test
        run: npm test -- --ci --runInBand
